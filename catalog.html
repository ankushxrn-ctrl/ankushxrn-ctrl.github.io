<!DOCTYPE html>
<html>
<head>
<title>Vihan Store</title>
<style>
body { background:linear-gradient(135deg,#ff758c,#ff7eb3,#8e6cff); font-family:sans-serif; margin:0; padding:20px 15px 40px; }
h1 { text-align:center; color:#fff; margin:10px 0 2px; }
.sub { text-align:center; color:#ffe3f0; margin:0 0 18px; font-size:14px; }
.grid { display:grid; grid-template-columns:1fr; gap:16px; max-width:480px; margin:auto; }
.card { background:#fff; border-radius:16px; padding:12px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,0.25); position:relative; }
.badge { position:absolute; top:10px; left:10px; background:#ff3d00; color:#fff; font-size:12px; font-weight:bold; padding:4px 10px; border-radius:12px; z-index:1; }
.photos { display:flex; overflow-x:auto; gap:8px; scroll-snap-type:x mandatory; border-radius:10px; }
.photos img { width:100%; flex:0 0 100%; scroll-snap-align:center; border-radius:10px; height:320px; object-fit:cover; }
.name { color:#222; font-size:15px; margin:10px 6px 4px; }
.price { color:#e60023; font-weight:bold; font-size:24px; margin:4px; }
.btn { display:block; background:linear-gradient(90deg,#25D366,#128C7E); color:#fff; padding:12px; border-radius:25px; text-decoration:none; font-weight:bold; margin-top:8px; font-size:16px; }
</style>
</head>
